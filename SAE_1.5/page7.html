<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- Titre affiché dans l’onglet du navigateur -->
    <title>Création de compte</title>

    <!-- Lien vers la feuille de style CSS commune -->
    <link rel="stylesheet" href="style/index.css">
</head>

<body>
<!-- Header : partie haute avec logo et titre -->
<header>
    <!-- Logo de l’IUT cliquable qui renvoie vers le site officiel -->
    <a href="https://www.iut-velizy-rambouillet.uvsq.fr/">
        <img src="image/iut_velizy.png" alt="Image de l'IUT de Vélizy" width="400px" height="auto">
    </a>
    <!-- Titre principal -->
    <h1>IUT de Vélizy - Département informatique</h1>
</header>

<!-- Menu de navigation principal -->
<nav class="menu">
    <ul>
        <!-- Lien vers la page d’accueil -->
        <li><a href="index.html">Accueil</a></li>

        <!-- Menu déroulant pour les organisations -->
        <li class="dropdown">
            <a href="#">Organisations</a>
            <ul class="submenu">
                <li><a href="page1.html">Capgemini Engineering</a></li>
                <li><a href="page2.html">Association Bernard Gregory</a></li>
                <li><a href="page3.html">INRAE</a></li>
            </ul>
        </li>

        <!-- Autres pages -->
        <li><a href="page4.html">Secteur</a></li>
        <li><a href="page5.html">Idées</a></li>

        <!-- Lien vers la page de connexion -->
        <li class="connexion"><a href="page6.html">Connexion</a></li>
    </ul>
</nav>

<!-- Contenu principal -->
<main>
    <!-- Section contenant le formulaire de création de compte -->
    <section class="register-container">
        <h1>Créer un compte</h1>

        <!-- Formulaire d’inscription -->
        <form method="POST" action="#">
            <!-- Champ nom d’utilisateur -->
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required>
            </div>

            <!-- Champ sexe avec boutons radio -->
            <div class="form-group">
                <label>Sexe</label>

                <input type="radio" id="homme" name="sexe" value="homme" required>
                <label for="homme">Homme</label>

                <input type="radio" id="femme" name="sexe" value="femme">
                <label for="femme">Femme</label>

                <input type="radio" id="autre" name="sexe" value="autre">
                <label for="autre">Autre</label>
            </div>

            <!-- Champ date de naissance avec listes déroulantes -->
            <div class="form-group">
                <label for="date">Date de naissance</label>

                <!-- Sélection du jour -->
                <label for="day">Jour</label>
                <select id="day" name="day" required>
                    <option value="">Jour</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <!-- etc -->
                    <option value="31">31</option>
                </select>

                <!-- Sélection du mois -->
                <label for="month">Mois</label>
                <select id="month" name="month" required>
                    <option value="">Mois</option>
                    <option value="1">Janvier</option>
                    <option value="2">Février</option>
                    <option value="3">Mars</option>
                    <option value="4">Avril</option>
                    <option value="5">Mai</option>
                    <option value="6">Juin</option>
                    <option value="7">Juillet</option>
                    <option value="8">Août</option>
                    <option value="9">Septembre</option>
                    <option value="10">Octobre</option>
                    <option value="11">Novembre</option>
                    <option value="12">Décembre</option>
                </select>

                <!-- Sélection de l’année -->
                <label for="year">Année</label>
                <select id="year" name="year" required>
                    <option value="">Année</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <!-- etc -->
                    <option value="1950">1950</option>
                </select>
            </div>

            <!-- Champ email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Champ mot de passe -->
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- Champ confirmation du mot de passe -->
            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <!-- Bouton de soumission -->
            <button type="submit">Créer le compte</button>
        </form>

        <!-- Petit footer interne pour proposer la connexion -->
        <div class="footer">
            <p>Déjà un compte ? <a href="page6.html">Se connecter</a></p>
        </div>
    </section>
</main>

<!-- Footer : bas de page avec navigation -->
<footer>
    <!-- Lien vers la page précédente -->
    <a href="page6.html" class="precedente">Page Précédente</a>

    <!-- Texte centré -->
    <p>Rejoignez-nous</p>

    <!-- Lien vers la page suivante (retour accueil) -->
    <a href="index.html" class="suivante">Retour à l'accueil</a>
</footer>
</body>
</html>
